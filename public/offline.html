<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d0f26">
<title>Offline · Vanderbilt Family</title>
<link rel="icon" href="/icons/favicon-32.png">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f6f3ef; color: #2d0f26; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 360px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font: 600 26px/1.2 Georgia, "Times New Roman", serif; margin: 20px 0 8px; }
  p { margin: 0 0 24px; color: #6b5d68; }
  button { font: 600 16px/1 system-ui, sans-serif; padding: 14px 24px; border: 0; border-radius: 12px; background: #6a2d5e; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Vanderbilt Family needs a connection to show your family's latest chores, calendar and lists. It will open again as soon as you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
